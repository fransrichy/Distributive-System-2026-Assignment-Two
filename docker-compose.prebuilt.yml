# Use prebuilt JARs (run 'bal build' in each service first):
#   docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d --build
services:
  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile.prebuilt
  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile.prebuilt
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile.prebuilt
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile.prebuilt
  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile.prebuilt
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.prebuilt
  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile.prebuilt
  # MongoDB 5.0+ needs a CPU with AVX instructions. Low-end CPUs (e.g. Intel Celeron N4020)
  # do not have AVX, so this override uses MongoDB 4.4, the last release that runs without it.
  mongodb:
    image: mongo:4.4

# API gateway + static web UI.
#   /                         -> single page app
#   /api/<name>-service/...   -> http://<name>-service:<port>/...   (Docker DNS)
# Resolving at request time (resolver 127.0.0.11) means restarted or scaled-out
# containers are picked up without reloading nginx.

map $uri $service_port {
    ~^/api/customer-service/      8081;
    ~^/api/restaurant-service/    8082;
    ~^/api/order-service/         8083;
    ~^/api/payment-service/       8084;
    ~^/api/delivery-service/      8085;
    ~^/api/notification-service/  8086;
    ~^/api/admin-service/         8087;
    default                       0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location ~ ^/api/(?<svc>[a-z]+)-service/(?<rest>.*)$ {
        if ($service_port = 0) {
            return 404 '{"message":"unknown service","code":"NOT_FOUND"}';
        }
        proxy_pass http://$svc-service:$service_port/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Scrapes the Prometheus endpoint exposed by every Ballerina service
# (ballerinax/prometheus observability extension on port 9797).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: food-delivery-services
    metrics_path: /metrics
    dns_sd_configs:
      # Docker DNS returns one A record per replica, so scaled-out services are discovered too
      - names: [customer-service, restaurant-service, order-service, payment-service,
                delivery-service, notification-service, admin-service]
        type: A
        port: 9797
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
